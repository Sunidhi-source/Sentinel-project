<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sentinel — Live Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://unpkg.com/react@18/umd/react.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone/babel.min.js"
      crossorigin
    ></script>
    <style>
      body {
        background: #0b0f14;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-thumb {
        background: #263241;
        border-radius: 4px;
      }
    </style>
  </head>
  <body class="text-slate-200">
    <div id="root"></div>

    <script type="text/plain" id="app-source">
      const { useEffect, useRef, useState, useMemo } = React;

      const MAX_POINTS = 60;
      const WS_PATH = "/sentinel/stream";

      function useSentinelStream() {
        const [events, setEvents] = useState([]);
        const [connected, setConnected] = useState(false);
        const wsRef = useRef(null);

        useEffect(() => {
          let stop = false;
          function connect() {
            const proto = location.protocol === "https:" ? "wss:" : "ws:";
            const ws = new WebSocket(`${proto}//${location.host}${WS_PATH}`);
            wsRef.current = ws;
            ws.onopen = () => setConnected(true);
            ws.onclose = () => {
              setConnected(false);
              if (!stop) setTimeout(connect, 1500);
            };
            ws.onerror = () => ws.close();
            ws.onmessage = (msg) => {
              try {
                const evt = JSON.parse(msg.data);
                setEvents((prev) => [...prev.slice(-999), evt]);
              } catch {}
            };
          }
          connect();
          return () => { stop = true; wsRef.current && wsRef.current.close(); };
        }, []);

        return { events, connected };
      }

      function StatCard({ label, value, accent }) {
        return (
          <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex-1 min-w-[160px]">
            <div className="text-xs uppercase tracking-wide text-slate-400">{label}</div>
            <div className={`text-3xl font-semibold mt-1 ${accent || "text-slate-100"}`}>{value}</div>
          </div>
        );
      }

      // --- Hand-rolled SVG line chart (no external charting lib) ---
      function LineChart({ data, series, width = 700, height = 240 }) {
        const padding = { top: 10, right: 10, bottom: 24, left: 32 };
        const innerW = width - padding.left - padding.right;
        const innerH = height - padding.top - padding.bottom;

        const maxY = Math.max(1, ...data.flatMap((d) => series.map((s) => d[s.key] || 0)));
        const n = Math.max(1, data.length - 1);

        const xFor = (i) => padding.left + (innerW * i) / n;
        const yFor = (v) => padding.top + innerH - (innerH * v) / maxY;

        const pathFor = (key) =>
          data.map((d, i) => `${i === 0 ? "M" : "L"} ${xFor(i).toFixed(1)} ${yFor(d[key] || 0).toFixed(1)}`).join(" ");

        const yTicks = [0, 0.5, 1].map((f) => Math.round(maxY * f));

        if (data.length === 0) {
          return <div className="text-slate-500 text-sm flex items-center justify-center" style={{ height }}>Waiting for traffic…</div>;
        }

        return (
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full" style={{ height }}>
            {yTicks.map((t, i) => (
              <g key={i}>
                <line
                  x1={padding.left} x2={width - padding.right}
                  y1={yFor(t)} y2={yFor(t)}
                  stroke="#1e293b" strokeWidth="1"
                />
                <text x={4} y={yFor(t) + 3} fontSize="10" fill="#64748b">{t}</text>
              </g>
            ))}
            {series.map((s) => (
              <path key={s.key} d={pathFor(s.key)} fill="none" stroke={s.color} strokeWidth="2" />
            ))}
            {data.length > 1 && data.filter((_, i) => i % Math.ceil(data.length / 6) === 0).map((d, idx, arr) => {
              const realIndex = data.indexOf(d);
              return (
                <text key={idx} x={xFor(realIndex)} y={height - 6} fontSize="9" fill="#64748b" textAnchor="middle">
                  {d.label}
                </text>
              );
            })}
          </svg>
        );
      }

      // --- Hand-rolled SVG stacked bar chart ---
      function BarChart({ data, series, width = 700, height = 220 }) {
        const padding = { top: 10, right: 10, bottom: 30, left: 32 };
        const innerW = width - padding.left - padding.right;
        const innerH = height - padding.top - padding.bottom;

        if (data.length === 0) {
          return <div className="text-slate-500 text-sm flex items-center justify-center" style={{ height }}>No route activity yet.</div>;
        }

        const totals = data.map((d) => series.reduce((sum, s) => sum + (d[s.key] || 0), 0));
        const maxTotal = Math.max(1, ...totals);
        const barWidth = Math.min(60, innerW / data.length - 16);
        const gap = innerW / data.length;

        return (
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full" style={{ height }}>
            {[0, 0.5, 1].map((f, i) => {
              const y = padding.top + innerH - innerH * f;
              return <line key={i} x1={padding.left} x2={width - padding.right} y1={y} y2={y} stroke="#1e293b" strokeWidth="1" />;
            })}
            {data.map((d, i) => {
              const x = padding.left + gap * i + (gap - barWidth) / 2;
              let yCursor = padding.top + innerH;
              return (
                <g key={d.route}>
                  {series.map((s) => {
                    const val = d[s.key] || 0;
                    const h = (innerH * val) / maxTotal;
                    yCursor -= h;
                    return <rect key={s.key} x={x} y={yCursor} width={barWidth} height={h} fill={s.color} rx="2" />;
                  })}
                  <text x={x + barWidth / 2} y={height - 10} fontSize="10" fill="#94a3b8" textAnchor="middle">
                    {d.route.length > 12 ? d.route.slice(0, 12) + "…" : d.route}
                  </text>
                </g>
              );
            })}
          </svg>
        );
      }

      function Legend({ items }) {
        return (
          <div className="flex gap-4 mt-2">
            {items.map((it) => (
              <div key={it.label} className="flex items-center gap-1.5 text-xs text-slate-400">
                <span className="w-2.5 h-2.5 rounded-sm inline-block" style={{ background: it.color }} />
                {it.label}
              </div>
            ))}
          </div>
        );
      }

      function App() {
        const { events, connected } = useSentinelStream();
        const [tick, setTick] = useState(0);

        useEffect(() => {
          const id = setInterval(() => setTick((t) => t + 1), 1000);
          return () => clearInterval(id);
        }, []);

        const timeSeries = useMemo(() => {
          const buckets = new Map();
          for (const e of events) {
            const sec = Math.floor(e.ts / 1000);
            const b = buckets.get(sec) || { time: sec, allowed: 0, throttled: 0 };
            if (e.type === "allowed") b.allowed++;
            if (e.type === "throttled") b.throttled++;
            buckets.set(sec, b);
          }
          const arr = Array.from(buckets.values()).sort((a, b) => a.time - b.time);
          return arr.slice(-MAX_POINTS).map((b) => ({
            ...b,
            label: new Date(b.time * 1000).toLocaleTimeString([], { hour12: false, minute: "2-digit", second: "2-digit" }),
          }));
        }, [events, tick]);

        const totals = useMemo(() => {
          let allowed = 0, throttled = 0, redisDown = 0;
          for (const e of events) {
            if (e.type === "allowed") allowed++;
            else if (e.type === "throttled") throttled++;
            else if (e.type === "redis-down") redisDown++;
          }
          return { allowed, throttled, redisDown, total: allowed + throttled };
        }, [events]);

        const topOffenders = useMemo(() => {
          const counts = new Map();
          for (const e of events) {
            if (e.type !== "throttled") continue;
            const k = e.scopeKey || "unknown";
            counts.set(k, (counts.get(k) || 0) + 1);
          }
          return Array.from(counts.entries())
            .map(([key, count]) => ({ key, count }))
            .sort((a, b) => b.count - a.count)
            .slice(0, 8);
        }, [events]);

        const perRoute = useMemo(() => {
          const map = new Map();
          for (const e of events) {
            if (e.type !== "allowed" && e.type !== "throttled") continue;
            const r = map.get(e.route) || { route: e.route, allowed: 0, throttled: 0 };
            if (e.type === "allowed") r.allowed++; else r.throttled++;
            map.set(e.route, r);
          }
          return Array.from(map.values());
        }, [events]);

        const throttleRate = totals.total ? ((totals.throttled / totals.total) * 100).toFixed(1) : "0.0";

        return (
          <div className="min-h-screen p-6 max-w-7xl mx-auto">
            <header className="flex items-center justify-between mb-6">
              <div>
                <h1 className="text-2xl font-bold tracking-tight">🛡️ Sentinel</h1>
                <p className="text-slate-400 text-sm">Live rate-limit gateway dashboard</p>
              </div>
              <div className={`text-xs px-3 py-1 rounded-full border ${connected ? "border-emerald-600 text-emerald-400 bg-emerald-950" : "border-red-600 text-red-400 bg-red-950"}`}>
                {connected ? "● stream connected" : "● reconnecting…"}
              </div>
            </header>

            <div className="flex flex-wrap gap-4 mb-6">
              <StatCard label="Total Requests (session)" value={totals.total.toLocaleString()} />
              <StatCard label="Throttled" value={totals.throttled.toLocaleString()} accent="text-amber-400" />
              <StatCard label="Throttle Rate" value={`${throttleRate}%`} accent="text-amber-400" />
              <StatCard label="Redis Degraded Events" value={totals.redisDown} accent={totals.redisDown ? "text-red-400" : "text-slate-100"} />
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
              <div className="lg:col-span-2 bg-slate-900/60 border border-slate-800 rounded-xl p-4">
                <div className="text-sm text-slate-400 mb-2">Throughput (req/sec, allowed vs throttled)</div>
                <LineChart
                  data={timeSeries}
                  series={[
                    { key: "allowed", color: "#34d399" },
                    { key: "throttled", color: "#f59e0b" },
                  ]}
                />
                <Legend items={[{ label: "Allowed", color: "#34d399" }, { label: "Throttled", color: "#f59e0b" }]} />
              </div>

              <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-4">
                <div className="text-sm text-slate-400 mb-2">Top Throttled Keys/IPs</div>
                <div className="space-y-2 max-h-[260px] overflow-y-auto">
                  {topOffenders.length === 0 && <div className="text-slate-500 text-sm">No throttled requests yet.</div>}
                  {topOffenders.map((o) => (
                    <div key={o.key} className="flex items-center justify-between text-sm bg-slate-950/50 rounded-lg px-3 py-2">
                      <span className="font-mono text-slate-300 truncate max-w-[160px]">{o.key}</span>
                      <span className="text-amber-400 font-semibold">{o.count}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-4">
              <div className="text-sm text-slate-400 mb-2">Per-Route Limit Utilization (session totals)</div>
              <BarChart
                data={perRoute}
                series={[
                  { key: "allowed", color: "#34d399" },
                  { key: "throttled", color: "#f59e0b" },
                ]}
              />
              <Legend items={[{ label: "Allowed", color: "#34d399" }, { label: "Throttled", color: "#f59e0b" }]} />
            </div>

            <footer className="text-center text-slate-600 text-xs mt-6">
              Sentinel — distributed rate limiting, atomic via Redis Lua (EVALSHA)
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>

    <script>
      // We transform + run the app source manually (instead of relying on Babel's
      // automatic type="text/babel" script-tag scanner). The auto-scanner defaults
      // to React's "automatic" JSX runtime, which injects
      //   import { jsx as _jsx } from "react/jsx-runtime";
      // at the top of the compiled output. That's an ES module import, but the
      // script gets re-inserted as a plain classic script — hence:
      //   "Uncaught SyntaxError: Cannot use import statement outside a module"
      // Forcing the "classic" runtime makes Babel emit React.createElement(...)
      // calls instead, which run fine as a normal script.
      (function () {
        const source = document.getElementById("app-source").textContent;
        const { code } = Babel.transform(source, {
          presets: [["react", { runtime: "classic" }]],
          filename: "dashboard.jsx",
        });
        const script = document.createElement("script");
        script.textContent = code;
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
