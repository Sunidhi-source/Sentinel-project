<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sentinel — Live Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/recharts@2/umd/Recharts.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<style>
  body { background: #0b0f14; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #263241; border-radius: 4px; }
</style>
</head>
<body class="text-slate-200">
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useEffect, useRef, useState, useMemo } = React;
const {
  ResponsiveContainer, LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip,
  BarChart, Bar, Legend,
} = Recharts;

const MAX_POINTS = 60;
const WS_PATH = "/sentinel/stream";

function useSentinelStream() {
  const [events, setEvents] = useState([]);
  const [connected, setConnected] = useState(false);
  const wsRef = useRef(null);

  useEffect(() => {
    let stop = false;
    function connect() {
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${proto}//${location.host}${WS_PATH}`);
      wsRef.current = ws;
      ws.onopen = () => setConnected(true);
      ws.onclose = () => {
        setConnected(false);
        if (!stop) setTimeout(connect, 1500);
      };
      ws.onerror = () => ws.close();
      ws.onmessage = (msg) => {
        try {
          const evt = JSON.parse(msg.data);
          setEvents((prev) => [...prev.slice(-999), evt]);
        } catch {}
      };
    }
    connect();
    return () => { stop = true; wsRef.current && wsRef.current.close(); };
  }, []);

  return { events, connected };
}

function StatCard({ label, value, accent }) {
  return (
    <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex-1 min-w-[160px]">
      <div className="text-xs uppercase tracking-wide text-slate-400">{label}</div>
      <div className={`text-3xl font-semibold mt-1 ${accent || "text-slate-100"}`}>{value}</div>
    </div>
  );
}

function App() {
  const { events, connected } = useSentinelStream();
  const [tick, setTick] = useState(0);

  useEffect(() => {
    const id = setInterval(() => setTick((t) => t + 1), 1000);
    return () => clearInterval(id);
  }, []);

  // Rolling per-second throughput / throttle counters
  const timeSeries = useMemo(() => {
    const buckets = new Map();
    for (const e of events) {
      const sec = Math.floor(e.ts / 1000);
      const b = buckets.get(sec) || { time: sec, allowed: 0, throttled: 0 };
      if (e.type === "allowed") b.allowed++;
      if (e.type === "throttled") b.throttled++;
      buckets.set(sec, b);
    }
    const arr = Array.from(buckets.values()).sort((a, b) => a.time - b.time);
    return arr.slice(-MAX_POINTS).map((b) => ({
      ...b,
      label: new Date(b.time * 1000).toLocaleTimeString(),
    }));
  }, [events, tick]);

  const totals = useMemo(() => {
    let allowed = 0, throttled = 0, redisDown = 0;
    for (const e of events) {
      if (e.type === "allowed") allowed++;
      else if (e.type === "throttled") throttled++;
      else if (e.type === "redis-down") redisDown++;
    }
    return { allowed, throttled, redisDown, total: allowed + throttled };
  }, [events]);

  const topOffenders = useMemo(() => {
    const counts = new Map();
    for (const e of events) {
      if (e.type !== "throttled") continue;
      const k = e.scopeKey || "unknown";
      counts.set(k, (counts.get(k) || 0) + 1);
    }
    return Array.from(counts.entries())
      .map(([key, count]) => ({ key, count }))
      .sort((a, b) => b.count - a.count)
      .slice(0, 8);
  }, [events]);

  const perRoute = useMemo(() => {
    const map = new Map();
    for (const e of events) {
      if (e.type !== "allowed" && e.type !== "throttled") continue;
      const r = map.get(e.route) || { route: e.route, allowed: 0, throttled: 0 };
      if (e.type === "allowed") r.allowed++; else r.throttled++;
      map.set(e.route, r);
    }
    return Array.from(map.values());
  }, [events]);

  const throttleRate = totals.total ? ((totals.throttled / totals.total) * 100).toFixed(1) : "0.0";

  return (
    <div className="min-h-screen p-6 max-w-7xl mx-auto">
      <header className="flex items-center justify-between mb-6">
        <div>
          <h1 className="text-2xl font-bold tracking-tight">🛡️ Sentinel</h1>
          <p className="text-slate-400 text-sm">Live rate-limit gateway dashboard</p>
        </div>
        <div className={`text-xs px-3 py-1 rounded-full border ${connected ? "border-emerald-600 text-emerald-400 bg-emerald-950" : "border-red-600 text-red-400 bg-red-950"}`}>
          {connected ? "● stream connected" : "● reconnecting…"}
        </div>
      </header>

      <div className="flex flex-wrap gap-4 mb-6">
        <StatCard label="Total Requests (session)" value={totals.total.toLocaleString()} />
        <StatCard label="Throttled" value={totals.throttled.toLocaleString()} accent="text-amber-400" />
        <StatCard label="Throttle Rate" value={`${throttleRate}%`} accent="text-amber-400" />
        <StatCard label="Redis Degraded Events" value={totals.redisDown} accent={totals.redisDown ? "text-red-400" : "text-slate-100"} />
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
        <div className="lg:col-span-2 bg-slate-900/60 border border-slate-800 rounded-xl p-4">
          <div className="text-sm text-slate-400 mb-2">Throughput (req/sec, allowed vs throttled)</div>
          <ResponsiveContainer width="100%" height={260}>
            <LineChart data={timeSeries}>
              <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
              <XAxis dataKey="label" tick={{ fontSize: 10, fill: "#64748b" }} minTickGap={30} />
              <YAxis tick={{ fontSize: 10, fill: "#64748b" }} allowDecimals={false} />
              <Tooltip contentStyle={{ background: "#0f172a", border: "1px solid #1e293b" }} />
              <Line type="monotone" dataKey="allowed" stroke="#34d399" dot={false} strokeWidth={2} />
              <Line type="monotone" dataKey="throttled" stroke="#f59e0b" dot={false} strokeWidth={2} />
            </LineChart>
          </ResponsiveContainer>
        </div>

        <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-4">
          <div className="text-sm text-slate-400 mb-2">Top Throttled Keys/IPs</div>
          <div className="space-y-2 max-h-[260px] overflow-y-auto">
            {topOffenders.length === 0 && <div className="text-slate-500 text-sm">No throttled requests yet.</div>}
            {topOffenders.map((o) => (
              <div key={o.key} className="flex items-center justify-between text-sm bg-slate-950/50 rounded-lg px-3 py-2">
                <span className="font-mono text-slate-300 truncate max-w-[160px]">{o.key}</span>
                <span className="text-amber-400 font-semibold">{o.count}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="bg-slate-900/60 border border-slate-800 rounded-xl p-4">
        <div className="text-sm text-slate-400 mb-2">Per-Route Limit Utilization (session totals)</div>
        <ResponsiveContainer width="100%" height={240}>
          <BarChart data={perRoute}>
            <CartesianGrid strokeDasharray="3 3" stroke="#1e293b" />
            <XAxis dataKey="route" tick={{ fontSize: 11, fill: "#64748b" }} />
            <YAxis tick={{ fontSize: 10, fill: "#64748b" }} allowDecimals={false} />
            <Tooltip contentStyle={{ background: "#0f172a", border: "1px solid #1e293b" }} />
            <Legend wrapperStyle={{ fontSize: 12 }} />
            <Bar dataKey="allowed" stackId="a" fill="#34d399" />
            <Bar dataKey="throttled" stackId="a" fill="#f59e0b" />
          </BarChart>
        </ResponsiveContainer>
      </div>

      <footer className="text-center text-slate-600 text-xs mt-6">
        Sentinel — distributed rate limiting, atomic via Redis Lua (EVALSHA)
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
